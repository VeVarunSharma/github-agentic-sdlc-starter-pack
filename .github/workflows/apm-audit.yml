# APM audit — Drift + policy check
#
# What it gates:
#   1. `apm install --target copilot` — restores the dependency cache
#      in the fresh runner and verifies that doing so does not change
#      committed APM-managed files.
#   2. `apm install --frozen --target copilot` — replays the now-local
#      lockfile without refetching dependencies.
#   3. `apm audit --ci --policy ./apm-policy.yml` — enforces the
#      governance policy (allow-list, MCP transports, signature
#      checks, unmanaged-files action) and performs drift detection by
#      default. SARIF findings are uploaded to the Security tab so
#      violations show alongside CodeQL.
#
# What it explicitly does NOT do:
#   * It must NOT run `apm compile -t copilot`. The hand-authored
#     `.github/copilot-instructions.md` is a hand-authored bridge to the
#     canonical AGENTS.md map; `apm compile` would overwrite it. Compilation
#     is reserved
#     for repos that are 100% APM-managed — see
#     `docs/apm-ownership-model.md`.
#
# Cadence:
#   * Every PR (so policy violations surface before merge).
#   * Push to main (so the Security tab stays in sync after merges).
#   * `apm-update.yml` covers freshness — this workflow is purely
#     drift / policy.

name: APM Audit

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  security-events: write   # required for upload-sarif

concurrency:
  group: apm-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APM_VERSION: '0.28.0'

jobs:
  audit:
    name: apm install + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install APM CLI (pinned)
        run: |
          APM_VERSION="${APM_VERSION}" APM_BIN_DIR="${RUNNER_TEMP}/bin" ./scripts/install-apm.sh
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Prime APM dependency cache
        run: |
          apm install --target copilot
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "::error::apm install changed committed files. Run apm install locally and commit the generated results."
            exit 1
          fi

      - name: Validate frozen lock replay
        run: apm install --frozen --target copilot

      - name: apm audit
        run: apm audit --ci --policy ./apm-policy.yml --format sarif --output apm-audit.sarif

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('apm-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: apm-audit.sarif
          category: apm-audit
