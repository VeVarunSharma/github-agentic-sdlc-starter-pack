# CodeQL — Static analysis
#
# Part of the GHAS baseline. Free for public repos; requires a GHAS
# license for private repos (documented in `docs/repo-settings-checklist.md`
# and `README.md`).
#
# Languages: JavaScript today (the sample app). Add `language: actions`
# once it becomes generally available in your org if you want CodeQL to
# scan workflow files for tainted patterns.
#
# Scope:
#   * PR runs scan the diff so authors see findings inline on the PR.
#   * Push-to-main runs feed the Security tab so unmerged findings are
#     visible to security teams.
#   * Weekly schedule re-scans default-branch HEAD against the latest
#     CodeQL queries so newly published rules surface against existing
#     code.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sunday 09:42 UTC — pick an off-peak time to avoid Monday-morning
    # contention with all the other weekly schedules.
    - cron: '42 9 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Use the default suite — adds security-extended to surface
          # higher-confidence security findings without overwhelming
          # the PR with quality lints. Adjust per org policy.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
