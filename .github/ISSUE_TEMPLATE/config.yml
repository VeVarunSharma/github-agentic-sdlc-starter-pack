    url: https://github.com/<owner>/<repo>/security/advisories/new
    about: Report a vulnerability privately via GitHub Private Vulnerability Reporting. Do NOT open a public issue for security findings.
  - name: 📚 Microsoft Learn
    url: https://learn.microsoft.com/azure/app-service/
    about: Azure App Service / OIDC reference docs.
  - name: 🤖 GitHub Copilot docs
    url: https://docs.github.com/copilot
    about: Copilot coding agent, chat, instructions, MCP.
