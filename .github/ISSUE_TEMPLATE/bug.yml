name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please give us enough to reproduce.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: One paragraph. Include the unexpected behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit SHA
      placeholder: e.g. main @ abc1234
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - OS: macOS 15.1 / Ubuntu 24.04 / Windows 11
        - Node: 22.x
        - Terraform: 1.9.x
        - APM: 0.12.4

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste in code blocks. Redact any secrets first.
      render: shell
