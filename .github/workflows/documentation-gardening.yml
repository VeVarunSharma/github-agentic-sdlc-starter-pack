name: Documentation gardening

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: documentation-gardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: deterministic documentation and harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/harness/package-lock.json

      - name: Install harness dependencies
        run: npm --prefix tools/harness ci

      - name: Run fixture tests
        run: npm --prefix tools/harness test

      - name: Validate repository knowledge
        run: npm --prefix tools/harness run validate
