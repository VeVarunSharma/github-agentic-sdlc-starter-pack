# APM (Agent Package Manager) manifest.
#
# This file declares supplementary agent dependencies pulled from the
# github/awesome-copilot library. Running
# `apm install` installs them alongside the hand-authored primitives in
# `.github/instructions/` and `.agents/skills/`.
# The hand-authored files are NOT regenerated by APM and survive
# untouched (they appear as "unmanaged" warnings in `apm audit`, allowed
# by `unmanaged_files.action: warn` + ignore globs in apm-policy.yml).
#
# IMPORTANT: do NOT run `apm compile -t copilot` against this repo. That
# command would overwrite the hand-authored `.github/copilot-instructions.md`.
# See `docs/apm-ownership-model.md` for the full ownership table.
#
# To add a dependency:
#   1. Find it at https://github.com/github/awesome-copilot
#   2. Add it under `dependencies.apm:` below using the path
#      <owner>/<repo>/<path>#<sha-or-tag>
#   3. Run `apm install` locally, commit `apm.lock.yaml` and any new files
#   4. Confirm `apm audit --policy ./apm-policy.yml` reports 0 errors

name: github-agentic-sdlc-starter-pack
version: 1.0.0
description: |
  Reusable GitHub Agentic SDLC Starter Pack. Hand-authored .github/
  primitives plus a supplementary APM layer pulling 4 narrow instructions
  and 1 skill
  from github/awesome-copilot.
author: Ve Sharma

# Target client format. We target GitHub Copilot, which writes APM
# dependencies to `.github/instructions/`, `.github/prompts/`,
# `.github/agents/`, `.github/skills/`, and `.github/hooks/`. We
# deliberately do NOT use `apm compile -t copilot` (that would overwrite
# `.github/copilot-instructions.md`); CI runs `apm install` + `apm audit`
# only.
targets:
  - copilot

dependencies:
  # Awesome-copilot supplementary primitives. Each path is pinned to a
  # specific commit (the suffix after `#`) so installs are reproducible.
  # Refresh via `scripts/refresh-apm.sh` (see docs/upstream-sources.md).
  #
  # Verified at github/awesome-copilot @ ab7544d03d4c49fdd07f5958e1888ad39c4118e2
  # (2026-08-07 — "Merge pull request #2452 … add daily-focus-board skill"):
  # - 4 narrow instructions: container best practices, GitHub Actions CI/CD,
  #   Azure naming, and Terraform best practices.
  # - 1 multi-step skill: review-and-refactor (demonstrates the skill
  #   primitive alongside our hand-authored oidc-rotation skill).
  #
  apm:
    - github/awesome-copilot/instructions/containerization-docker-best-practices.instructions.md#ab7544d03d4c49fdd07f5958e1888ad39c4118e2
    - github/awesome-copilot/instructions/github-actions-ci-cd-best-practices.instructions.md#ab7544d03d4c49fdd07f5958e1888ad39c4118e2
    - github/awesome-copilot/instructions/azure-naming.instructions.md#ab7544d03d4c49fdd07f5958e1888ad39c4118e2
    - github/awesome-copilot/instructions/terraform.instructions.md#ab7544d03d4c49fdd07f5958e1888ad39c4118e2
    - github/awesome-copilot/skills/review-and-refactor#ab7544d03d4c49fdd07f5958e1888ad39c4118e2

# `auto` lets APM scan included paths automatically. Keep at default.
includes: auto

# No custom scripts at the manifest level — repo-level scripts live in
# `scripts/` (see scripts/verify.sh for the lint+test+terraform+audit
# composite check).
scripts: {}
